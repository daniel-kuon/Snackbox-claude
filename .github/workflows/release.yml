name: Release

# A Snackbox installation is a git checkout that is built and run in place (see
# install-snackbox.ps1), so a release is a tag plus notes - there is nothing to ship as a
# binary. In particular the Aspire AppHost cannot be published: its generated project metadata
# hardcodes the build machine's absolute .csproj paths, which do not exist anywhere else.
#
# This workflow builds the solution to prove the tag is sound, then publishes the release the
# app's Updates page reads.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - major
          - minor
          - bugfix
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the release notes and tag lookup

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install workloads
        run: |
          dotnet workload install aspire
          dotnet workload install maui

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $latestTag = git tag --list "v*.*.*" --sort=-v:refname | Select-Object -First 1
            $current = if ([string]::IsNullOrWhiteSpace($latestTag)) { "0.0.0" } else { $latestTag.TrimStart('v') }

            $parts = $current.Split('.')
            $major = [int]$parts[0]; $minor = [int]$parts[1]; $patch = [int]$parts[2]

            switch ("${{ inputs.release_type }}") {
              "major" { $major += 1; $minor = 0; $patch = 0 }
              "minor" { $minor += 1; $patch = 0 }
              "bugfix" { $patch += 1 }
              default { throw "Unknown release type: ${{ inputs.release_type }}" }
            }

            $version = "$major.$minor.$patch"
          } else {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }

          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing v$version"

      # The installation builds the same solution with the same command, so if this fails the
      # release would brick every machine that installs it.
      - name: Build the solution (Release)
        run: |
          dotnet restore Snackbox.sln
          dotnet build Snackbox.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test Snackbox.sln -c Release --no-build
        continue-on-error: true

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.TAG }}"
          git push origin "${{ steps.version.outputs.TAG }}"

      - name: Generate release notes
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          $previous = git tag --list "v*.*.*" --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1

          $commits = if ($previous) {
            git log "$previous..HEAD" --pretty=format:"- %s (%h)" --no-merges
          } else {
            git log --pretty=format:"- %s (%h)" --no-merges -n 30
          }

          $notes = @"
          ## What's new

          $($commits -join "`n")

          ## Updating

          Open **Admin -> Updates** in Snackbox and press Install. The machine stops, moves its
          checkout to this tag, rebuilds and starts again - a few minutes of downtime. A failed
          build rolls back to the previous commit automatically.

          From the command line instead:

          ``````powershell
          & "C:\Snackbox\tools\Snackbox.Updater\bin\Release\net10.0\Snackbox.Updater.exe" update --tag $tag
          ``````

          ## First installation

          ``````powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/install-snackbox.ps1 | iex
          ``````

          Needs git, the .NET 10 SDK and Docker Desktop on the machine.
          "@

          $notes | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Snackbox ${{ steps.version.outputs.TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
